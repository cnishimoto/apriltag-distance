[project]
name = "apriltag-live"
version = "1.0.0"
description = "Local AprilTag distance measurement with a TypeScript web interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "websockets>=13,<17",
    "numpy>=1.26,<3",
    "opencv-contrib-python-headless>=4.10,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.uv]
package = false
